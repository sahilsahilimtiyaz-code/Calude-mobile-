name: Build Android APK (debug)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Note: Puter.js auth uses a browser popup. If it ever fails inside the
# APK WebView, use the installed PWA / browser build instead.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Stage web assets
        run: npm run stage:www

      - name: Add and sync Android shell
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: claude-luxe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
